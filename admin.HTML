<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENCE - Administration</title>
  <style>
    :root {
      --primary: #d4af37;
      --bg-dark: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 30px 20px; }

    #admin-content { display: none; }

    .header-admin {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 900px; margin: 0 auto 30px; border-bottom: 2px solid var(--primary); padding-bottom: 15px;
    }
    .btn-site { color: var(--primary); text-decoration: none; border: 1px solid var(--primary); padding: 8px 16px; border-radius: 20px; font-weight: bold; }
    .btn-site:hover { background-color: var(--primary); color: black; }

    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { color: var(--primary); margin-bottom: 20px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-muted); }
    input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; background: #252525; border: 1px solid #333; color: var(--text); border-radius: 6px; }
    
    .btn-submit { background: var(--primary); color: black; font-weight: bold; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 1rem; }
    .btn-submit:hover { background: #b89628; }

    .product-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #2a2a2a; }
    .product-row:last-child { border-bottom: none; }
    .product-meta { display: flex; align-items: center; gap: 15px; }
    .product-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }

    .btn-action { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    .btn-toggle { background: #3498db; color: white; }
    .btn-delete { background: var(--danger); color: white; }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--primary);
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 5px;
      background: #252525;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
    }
  </style>

  <!-- SDK Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Connexion PIN -->
  <div id="login-screen" class="login-box">
    <h2 style="margin-bottom: 10px;">ESSENCE Admin</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Entrez votre code PIN pour accéder au panneau d'administration</p>
    <input type="password" id="pin-input" placeholder="••••" maxlength="6">
    <button class="btn-submit" onclick="verifyPin()">Se connecter</button>
  </div>

  <!-- Panneau Admin -->
  <div id="admin-content">
    <div class="header-admin">
      <h1>Espace d'Administration</h1>
      <a href="index.html" class="btn-site" target="_blank">Voir la boutique client →</a>
    </div>

    <div class="container">
      <div class="card">
        <h2>Ajouter un Produit</h2>
        <form id="add-form">
          <div class="form-group">
            <label>Nom du produit</label>
            <input type="text" id="name" required placeholder="Ex: Sérum Hydratant">
          </div>
          <div class="form-group">
            <label>Prix</label>
            <input type="text" id="price" required placeholder="Ex: $20.00">
          </div>
          <div class="form-group">
            <label>Image du produit (depuis votre téléphone/PC)</label>
            <input type="file" id="image-file" accept="image/*" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="desc" rows="3" required placeholder="Description courte du produit..."></textarea>
          </div>
          <button type="submit" class="btn-submit">Ajouter le produit</button>
        </form>
      </div>

      <div class="card">
        <h2>Gestion du Stock</h2>
        <div id="admin-list">Chargement des produits...</div>
      </div>
    </div>
  </div>

  <script>
    // Code PIN confidentiel (Vous pouvez le modifier ici)
    const ADMIN_PIN = "1234";

    function verifyPin() {
      const enteredPin = document.getElementById('pin-input').value;
      if (enteredPin === ADMIN_PIN) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        initAdmin();
      } else {
        alert("Code PIN incorrect !");
        document.getElementById('pin-input').value = "";
      }
    }

    document.getElementById('pin-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyPin();
    });

    // Configuration Firebase connectée
    const firebaseConfig = {
      apiKey: "AIzaSyAxxlim7Vp1g3_hHCIe6OghHgWsStdMoQ8",
      authDomain: "essence-cosmetics-81fa4.firebaseapp.com",
      databaseURL: "https://essence-cosmetics-81fa4-default-rtdb.firebaseio.com",
      projectId: "essence-cosmetics-81fa4",
      storageBucket: "essence-cosmetics-81fa4.firebasestorage.app",
      messagingSenderId: "735928544975",
      appId: "1:735928544975:web:35a4dfe2ae1db79b5211ba",
      measurementId: "G-31KCHEG4D5"
    };

    let db;

    function initAdmin() {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();

      let currentBase64Image = "";

      document.getElementById('image-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            currentBase64Image = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('add-form').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!currentBase64Image) return alert("Veuillez choisir une image.");

        const newRef = db.ref('products').push();
        newRef.set({
          name: document.getElementById('name').value,
          price: document.getElementById('price').value,
          desc: document.getElementById('desc').value,
          image: currentBase64Image,
          inStock: true
        }, (error) => {
          if (!error) {
            this.reset();
            currentBase64Image = "";
            alert("Produit ajouté avec succès !");
          }
        });
      });

      db.ref('products').on('value', (snapshot) => {
        const list = document.getElementById('admin-list');
        const data = snapshot.val();

        if (!data) {
          list.innerHTML = "<p style='color: var(--text-muted);'>Aucun produit enregistré.</p>";
          return;
        }

        list.innerHTML = "";
        Object.keys(data).forEach(id => {
          const p = data[id];
          const row = document.createElement('div');
          row.className = 'product-row';
          row.innerHTML = `
            <div class="product-meta">
              <img src="${p.image}" class="product-thumb" alt="${p.name}">
              <div>
                <strong>${p.name}</strong> - ${p.price}<br>
                <small style="color: ${p.inStock ? 'var(--success)' : 'var(--danger)'}">
                  ${p.inStock ? '● En Stock' : '● Rupture'}
                </small>
              </div>
            </div>
            <div>
              <button class="btn-action btn-toggle" onclick="toggleStock('${id}', ${p.inStock})">
                ${p.inStock ? 'Marquer Rupture' : 'Marquer En Stock'}
              </button>
              <button class="btn-action btn-delete" onclick="deleteProduct('${id}')">Supprimer</button>
            </div>
          `;
          list.appendChild(row);
        });
      });
    }

    function toggleStock(id, currentStatus) {
      db.ref('products/' + id).update({ inStock: !currentStatus });
    }

    function deleteProduct(id) {
      if (confirm("Supprimer ce produit ?")) {
        db.ref('products/' + id).remove();
      }
    }
  </script>
</body>
</html>
