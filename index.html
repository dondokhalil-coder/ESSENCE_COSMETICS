<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENCE - Cosmétiques & Beauté</title>
  <style>
    :root {
      --primary: #d4af37;
      --bg-dark: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #1f1f1f, #0f0f0f);
      text-align: center;
      padding: 60px 20px;
      border-bottom: 2px solid var(--primary);
    }

    .brand-name {
      font-size: 3rem;
      letter-spacing: 5px;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 700;
    }

    .brand-tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-top: 10px;
      font-style: italic;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 2rem;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary);
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: var(--primary);
      margin: 10px auto 0;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .product-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
    }

    .product-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .product-price {
      font-size: 1.4rem;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn-buy {
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: background 0.3s;
    }

    .btn-buy:hover {
      background-color: #1ebc57;
    }

    .badge-out {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: var(--danger);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-disabled {
      background-color: #555 !important;
      cursor: not-allowed;
    }

    footer {
      background-color: #050505;
      text-align: center;
      padding: 40px 20px;
      margin-top: 60px;
      border-top: 1px solid #222;
      color: var(--text-muted);
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .empty-msg {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 40px 0;
    }
  </style>

  <!-- Script Firebase Compatibles Navigateur -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1 class="brand-name">ESSENCE</h1>
    <p class="brand-tagline">Révélez votre beauté naturelle avec nos produits cosmétiques d'exception</p>
  </header>

  <div class="container">
    <h2 class="section-title">Nos Produits</h2>
    <div class="products-grid" id="products-container">
      <div class="empty-msg">Chargement des produits...</div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ESSENCE. Tous droits réservés.</p>
    <div class="contact-links">
      <p>📱 WhatsApp / Tél : <a href="https://wa.me/243978927811" target="_blank">+243 978 927 811</a></p>
      <p>✉️ Email : <a href="mailto:Lydiadondo1505@gmail.com">Lydiadondo1505@gmail.com</a></p>
      <p>📷 Instagram : <a href="https://www.instagram.com/lydia.dnd05" target="_blank">@lydia.dnd05</a></p>
    </div>
  </footer>

  <script>
    const WHATSAPP_PHONE = "243978927811";
    // Vos clés d'accès réelles Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAxxlim7Vp1g3_hHCIe6OghHgWsStdMoQ8",
      authDomain: "essence-cosmetics-81fa4.firebaseapp.com",
      databaseURL: "https://essence-cosmetics-81fa4-default-rtdb.firebaseio.com",
      projectId: "essence-cosmetics-81fa4",
      storageBucket: "essence-cosmetics-81fa4.firebasestorage.app",
      messagingSenderId: "735928544975",
      appId: "1:735928544975:web:35a4dfe2ae1db79b5211ba",
      measurementId: "G-31KCHEG4D5"
    };

    // Initialisation
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Récupération des données en temps réel
    db.ref('products').on('value', (snapshot) => {
      const container = document.getElementById('products-container');
      const data = snapshot.val();

      if (!data) {
        container.innerHTML = `<div class="empty-msg">Aucun produit n'est disponible pour le moment.</div>`;
        return;
      }

      container.innerHTML = '';
      Object.keys(data).forEach(id => {
        const product = data[id];
        const card = document.createElement('div');
        card.className = 'product-card';

        const encodedMsg = encodeURIComponent(`Bonjour ESSENCE ! Je souhaite commander le produit suivant :\n\n- *Produit* : ${product.name}\n- *Prix* : ${product.price}\n\nPouvons-nous échanger sur les détails de la livraison ?`);
        const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMsg}`;

        card.innerHTML = `
          ${!product.inStock ? '<span class="badge-out">Rupture</span>' : ''}
          <img src="${product.image}" alt="${product.name}" class="product-img">
          <div class="product-info">
            <h3 class="product-title">${product.name}</h3>
            <p class="product-desc">${product.desc}</p>
            <div class="product-price">${product.price}</div>
            ${product.inStock 
              ? `<a href="${waUrl}" target="_blank" class="btn-buy">Commander via WhatsApp</a>`
              : `<button class="btn-buy btn-disabled" disabled>Rupture de stock</button>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      console.error("Erreur Firebase :", error);
    });
  </script>
</body>
</html>
